[project]
name = "bb-factory"
version = "0.1.0"
description = "A board of tasks, a planner that fills it, coding agents that take them, and a secretary that talks to you"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]  # a run's workdir link under state/ has tests of its own
