  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    section + section { margin-top: 4rem; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>

        <rect x="104" y="568" width="12" height="8" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
        <text x="124" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">planner, never sees code</text>

        <rect x="408" y="568" width="12" height="8" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8" stroke-dasharray="3,2"/>
        <text x="428" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">spawned per task</text>
        <rect x="576" y="568" width="12" height="8" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>

        <line x1="744" y1="572" x2="772" y2="572" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="780" y="576" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">read / on demand</text>

    </section>

    <section>
      <p class="eyebrow">Sequence · one run · time flows down</p>
      <h1>Factory, what happens in which order</h1>

      <svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="factory-seq-title factory-seq-desc">
        <title id="factory-seq-title">Factory run as a sequence: goal, tasks, dispatch, handoff, wake, goal handoff</title>
        <desc id="factory-seq-desc">The orchestrator spawns the planner with a goal; the planner creates tasks on the board; every tick the orchestrator reads the board, sends unblocked tasks to the imitator, and forwards each handoff the imitator wrote on the board back to the planner, until the planner hands off the goal itself.</desc>
        <defs>
          <marker id="arrow-s" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-s-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-s-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- lifelines: planner 160 · board 400 · orchestrator 640 · imitator 880 -->
        <line x1="160" y1="88" x2="160" y2="680" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="400" y1="88" x2="400" y2="680" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="640" y1="88" x2="640" y2="680" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="880" y1="88" x2="880" y2="680" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- loop fragment: one tick, repeated -->
        <rect x="120" y="212" width="800" height="316" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="120" y="212" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="140" y="224" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
        <text x="172" y="224" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[every 10 s, until the goal is handed off]</text>

        <!-- activation: imitator working on a task -->
        <rect x="876" y="340" width="8" height="36" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- M1 orchestrator → planner: spawn with the goal -->
        <line x1="640" y1="140" x2="160" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-s)"/>
        <rect x="472" y="120" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="520" y="129" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SPAWN · GOAL</text>

        <!-- M2 planner → board: create tasks -->
        <line x1="160" y1="180" x2="400" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-s)"/>
        <rect x="232" y="160" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="280" y="169" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CREATE TASKS</text>

        <!-- M3 orchestrator → board: list -->
        <line x1="640" y1="264" x2="400" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-s)"/>
        <rect x="500" y="244" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="520" y="253" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LIST</text>

        <!-- M4 board → orchestrator: todo tasks (return) -->
        <line x1="400" y1="296" x2="640" y2="296" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-s)"/>
        <rect x="472" y="276" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="520" y="285" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TODO · UNBLOCKED</text>

        <!-- M5 orchestrator → imitator: task brief -->
        <line x1="640" y1="336" x2="876" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-s)"/>
        <rect x="720" y="316" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="760" y="325" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TASK BRIEF</text>

        <!-- M6 imitator → board: handoff (comment + in_review), crosses the orchestrator lifeline -->
        <line x1="876" y1="376" x2="400" y2="376" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-s)"/>
        <rect x="728" y="356" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="760" y="365" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HANDOFF</text>

        <!-- M7 board → orchestrator: next list sees in_review (return) -->
        <line x1="400" y1="416" x2="640" y2="416" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-s)"/>
        <rect x="464" y="396" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="520" y="405" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">IN_REVIEW + TEXT</text>

        <!-- M8 orchestrator → planner: wake (headline), crosses the board lifeline -->
        <line x1="640" y1="456" x2="160" y2="456" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-s-accent)"/>
        <rect x="224" y="436" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="280" y="445" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WAKE · HANDOFF</text>

        <!-- M9 planner → board: accept, send back, follow-ups -->
        <line x1="160" y1="496" x2="400" y2="496" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-s)"/>
        <rect x="224" y="476" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="280" y="485" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DONE·TODO·NEW</text>

        <!-- M10 planner → board: handoff on the goal -->
        <line x1="160" y1="560" x2="400" y2="560" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-s)"/>
        <rect x="216" y="540" width="128" height="12" rx="2" fill="#f5f5f5"/>
        <text x="280" y="549" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HANDOFF ON GOAL</text>

        <!-- M11 board → orchestrator: goal in_review (return) -->
        <line x1="400" y1="600" x2="640" y2="600" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-s)"/>
        <rect x="468" y="580" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="520" y="589" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GOAL IN_REVIEW</text>

        <!-- M12 orchestrator self: stop, archive the imitator -->
        <path d="M 644,632 L 680,632 L 680,660 L 644,660" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-s)"/>
        <rect x="692" y="640" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="696" y="649" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">STOP · ARCHIVE</text>

        <!-- actors -->
        <rect x="80" y="40" width="160" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="40" width="160" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="160" y="62" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Planner</text>
        <text x="160" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pi · terra</text>

        <rect x="320" y="40" width="160" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="40" width="160" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="400" y="62" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Board</text>
        <text x="400" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tasks.json</text>

        <rect x="560" y="40" width="160" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="560" y="40" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="640" y="62" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Orchestrator</text>
        <text x="640" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">factory/orchestrator.py</text>

        <rect x="800" y="40" width="160" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="800" y="40" width="160" height="48" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="880" y="62" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Imitator</text>
        <text x="880" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pi · terra · one thread</text>

        <!-- legend -->
        <line x1="30" y1="712" x2="970" y2="712" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="30" y="728" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
        <line x1="104" y1="724" x2="132" y2="724" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-s)"/>
        <text x="140" y="728" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">call / message</text>
        <line x1="264" y1="724" x2="292" y2="724" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-s)"/>
        <text x="300" y="728" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">what the board answers</text>
        <line x1="472" y1="724" x2="500" y2="724" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-s-accent)"/>
        <text x="508" y="728" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">the one message that moves the planner</text>
      </svg>
    </section>
